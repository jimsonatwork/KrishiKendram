name: Frontend browser acceptance

on:
  pull_request:
  push:
    branches:
      - main
      - 'cto/**'

permissions:
  contents: read

jobs:
  voice-agent-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Type-check Playwright acceptance tests
        run: npx tsc --ignoreConfig --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --strict --skipLibCheck --types node playwright.config.ts e2e/voice-agent.spec.ts

      - name: Run browser acceptance tests
        run: npm run test:e2e

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: voice-agent-playwright-failures
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
